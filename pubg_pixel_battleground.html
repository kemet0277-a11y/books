<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUBG Pixel Battleground</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #222; font-family: Arial, sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 800px; max-height: 500px; background: #557a2b; border: 4px solid #3e581e; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        canvas { display: block; width: 100%; height: 100%; background: #557a2b; }
        .ui-panel { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-size: 16px; }
        .health-bar-container { width: 120px; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .health-bar { width: 100%; height: 100%; background: #ff3333; transition: width 0.1s; }
        .controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; }
        .joystick-zone, .action-zone { pointer-events: auto; display: flex; gap: 10px; }
        .btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.25); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
        .btn-shoot { background: rgba(255, 50, 50, 0.4); border-color: #ff5555; width: 75px; height: 75px; font-size: 24px; }
        .btn-shoot:active { background: rgba(255, 50, 50, 0.7); }
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; z-index: 10; }
        .screen h1 { color: #f39c12; font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(243,156,18,0.5); }
        .screen p { font-size: 18px; margin-bottom: 20px; color: #ccc; }
        .screen button { padding: 12px 35px; font-size: 18px; background: #27ae60; border: none; color: white; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(39,174,96,0.4); }
        .screen button:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .zone-timer { color: #f1c40f; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-panel">
        <div>
            <div>اللاعبين الأعداء المتبقين: <span id="alive-count">10</span></div>
            <div class="health-bar-container"><div id="health-bar" class="health-bar"></div></div>
        </div>
        <div style="text-align: left;">
            <div>السكور: <span id="score-val">0</span></div>
            <div class="zone-timer" id="zone-warning">المنطقة الآمنة تتقلص!</div>
        </div>
    </div>

    <!-- شاشة البدء -->
    <div id="start-screen" class="screen">
        <h1>PUBG 2D Battleground</h1>
        <p>اهبط في ساحة المعركة، اجمع السلاح، واقضِ على الأعداء لتكون الناجي الأخير داخل الزون!</p>
        <button id="start-btn">ابدأ المعركة</button>
    </div>

    <!-- شاشة النهاية -->
    <div id="gameover-screen" class="screen hidden">
        <h1 id="end-title">جيم أوفر!</h1>
        <p id="end-desc"></p>
        <button id="restart-btn">إعادة المحاولة</button>
    </div>

    <!-- أزرار اللمس للتابلت -->
    <div class="controls">
        <div class="joystick-zone">
            <div class="btn" id="btn-up">⬆️</div>
            <div style="display: flex; flex-direction: column; gap: 20px; justify-content: center;">
                <div class="btn" id="btn-left">⬅️</div>
                <div class="btn" id="btn-right">➡️</div>
            </div>
            <div class="btn" id="btn-down">⬇️</div>
        </div>
        <div class="action-zone" style="align-items: flex-end;">
            <div class="btn btn-shoot" id="btn-shoot">💥</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ضبط أبعاد الـ Canvas الثابتة للعبة متناسقة
canvas.width = 800;
canvas.height = 500;

let gameActive = false;
let score = 0;
let enemiesAlive = 10;
let safeZoneRadius = 450;
let safeZoneX = 400;
let safeZoneY = 250;

const player = {
    x: 400, y: 250, radius: 15, speed: 4, health: 100, maxHealth: 100, angle: 0
};

let bullets = [];
let enemies = [];
let keys = {};
let touchControls = { up: false, down: false, left: false, right: false };

// توليد الأعداء بشكل عشوائي في الخريطة
function spawnEnemies() {
    enemies = [];
    for(let i=0; i<10; i++) {
        enemies.push({
            x: Math.random() * (canvas.width - 60) + 30,
            y: Math.random() * (canvas.height - 60) + 30,
            radius: 14,
            speed: Math.random() * 1 + 1.2,
            health: 50,
            angle: Math.random() * Math.PI * 2,
            lastShot: 0,
            shootCooldown: Math.random() * 1000 + 1000
        });
    }
    enemiesAlive = enemies.length;
    document.getElementById('alive-count').innerText = enemiesAlive;
}

// التحكم عبر الكيبورد
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// إعداد أزرار اللمس للتابلت
function setupTouchBtn(id, keyProp) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); touchControls[keyProp] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); touchControls[keyProp] = false; });
    btn.addEventListener('mousedown', () => touchControls[keyProp] = true);
    btn.addEventListener('mouseup', () => touchControls[keyProp] = false);
}
setupTouchBtn('btn-up', 'up');
setupTouchBtn('btn-down', 'down');
setupTouchBtn('btn-left', 'left');
setupTouchBtn('btn-right', 'right');

// زر إطلاق النار
const shootBtn = document.getElementById('btn-shoot');
const triggerShoot = () => { if(gameActive) playerShoot(); };
shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerShoot(); });
shootBtn.addEventListener('mousedown', triggerShoot);

function playerShoot() {
    bullets.push({
        x: player.x + Math.cos(player.angle) * player.radius,
        y: player.y + Math.sin(player.angle) * player.radius,
        vx: Math.cos(player.angle) * 7,
        vy: Math.sin(player.angle) * 7,
        isPlayer: true
    });
}

function update() {
    if (!gameActive) return;

    // حركه اللاعب بناءً على الكيبورد أو التاتش
    let dx = 0; let dy = 0;
    if (keys['KeyW'] || keys['ArrowUp'] || touchControls.up) dy = -player.speed;
    if (keys['KeyS'] || keys['ArrowDown'] || touchControls.down) dy = player.speed;
    if (keys['KeyA'] || keys['ArrowLeft'] || touchControls.left) dx = -player.speed;
    if (keys['KeyD'] || keys['ArrowRight'] || touchControls.right) dx = player.speed;

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy));

    // تحديث زاوية اتجاه اللاعب بناءً على حركته
    if (dx !== 0 || dy !== 0) {
        player.angle = Math.atan2(dy, dx);
    }

    // تقلص زون الأمان (PUBG Safe Zone)
    if (safeZoneRadius > 80) {
        safeZoneRadius -= 0.08;
    }

    // دمج اللاعب خارج الزون
    let distToZoneCenter = Math.hypot(player.x - safeZoneX, player.y - safeZoneY);
    if (distToZoneCenter > safeZoneRadius) {
        player.health -= 0.15;
    }

    // تحديث الرصاص
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // حذف الرصاص خارج الشاشة
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        // تصادم الرصاص
        if (b.isPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius) {
                    e.health -= 25;
                    bullets.splice(i, 1);
                    if (e.health <= 0) {
                        enemies.splice(j, 1);
                        score += 100;
                        enemiesAlive = enemies.length;
                        document.getElementById('alive-count').innerText = enemiesAlive;
                        document.getElementById('score-val').innerText = score;
                    }
                    break;
                }
            }
        } else {
            if (Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
                player.health -= 15;
                bullets.splice(i, 1);
            }
        }
    }

    // تحديث الأعداء (ذكاء اصطناعي بسيط يتحرك نحو اللاعب ويطلق النار داخل الزون)
    let now = Date.now();
    enemies.forEach(e => {
        let toPlayerX = player.x - e.x;
        let toPlayerY = player.y - e.y;
        let dist = Math.hypot(toPlayerX, toPlayerY);

        e.angle = Math.atan2(toPlayerY, toPlayerX);

        // التحرك ببطء نحو اللاعب إذا كان بعيداً
        if (dist > 100) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
        }

        // دمج الأعداء إذا كانوا خارج الزون
        if (Math.hypot(e.x - safeZoneX, e.y - safeZoneY) > safeZoneRadius) {
            e.health -= 0.1;
        }

        // إطلاق النار على اللاعب تلقائياً
        if (dist < 250 && now - e.lastShot > e.shootCooldown) {
            bullets.push({
                x: e.x + Math.cos(e.angle) * e.radius,
                y: e.y + Math.sin(e.angle) * e.radius,
                vx: Math.cos(e.angle) * 4.5,
                vy: Math.sin(e.angle) * 4.5,
                isPlayer: false
            });
            e.lastShot = now;
        }
    });

    // فلترة الأعداء الماتوا خارج الزون
    let activeEnemies = enemies.filter(e => e.health > 0);
    if(activeEnemies.length !== enemies.length) {
        enemies = activeEnemies;
        enemiesAlive = enemies.length;
        document.getElementById('alive-count').innerText = enemiesAlive;
    }

    // تحديث واجهة صحة اللاعب
    document.getElementById('health-bar').style.width = Math.max(0, player.health) + '%';

    // شروط الفوز والخسارة
    if (player.health <= 0) {
        endGame(false);
    } else if (enemiesAlive === 0) {
        endGame(true);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // رسم زون الأمان الخارجي (المنطقة الخطرة باللون الأحمر الشفاف)
    ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // تفريغ الزون الآمن الدائري
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(safeZoneX, safeZoneY, safeZoneRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // رسم حدود الزون الآمن باللون الأزرق المضيء للببجي
    ctx.beginPath();
    ctx.arc(safeZoneX, safeZoneY, safeZoneRadius, 0, Math.PI * 2);
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // رسم اللاعب (أزرق خوذة ليفيل 3)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#2980b9';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    // سلاح اللاعب
    ctx.fillStyle = '#34495e';
    ctx.fillRect(0, -4, 22, 8);
    ctx.restore();

    // رسم الأعداء (لون عسكري/أحمر)
    enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
        ctx.fill();
        // سلاح العدو
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(0, -3, 18, 6);
        ctx.restore();
    });

    // رسم الرصاص
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.isPlayer ? '#f1c40f' : '#e67e22';
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    player.x = 400; player.y = 250;
    player.health = 100;
    score = 0;
    safeZoneRadius = 450;
    document.getElementById('score-val').innerText = score;
    spawnEnemies();
    gameActive = true;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
}

function endGame(isWin) {
    gameActive = false;
    document.getElementById('gameover-screen').classList.remove('hidden');
    if (isWin) {
        document.getElementById('end-title').innerText = "Winner Winner Chicken Dinner! 🍗";
        document.getElementById('end-desc').innerText = `مبروك! صمدت كآخر ناجي في المعركة. السكور النهائي: ${score}`;
    } else {
        document.getElementById('end-title').innerText = "لقد قُتلت في المعركة! 💀";
        document.getElementById('end-desc').innerText = `حظاً أوفراً في المرة القادمة. الأعداء المتبقين: ${enemiesAlive}`;
    }
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// تشغيل اللوب اللانهائي للرسم والتحضير
gameLoop();
</script>
</body>
</html>
